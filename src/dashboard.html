<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>能力管理器</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20252b;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 24px}header{border-bottom:1px solid #d5dbe2;padding-bottom:22px}h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:0}p{line-height:1.7}small{color:#245eaa;font-weight:600;letter-spacing:.08em}.notice{padding:14px 18px;background:#fff4dd;color:#71420d;border-left:3px solid #925b12}#status{color:#4d5865;font-size:14px}ul{list-style:none;padding:0}li{padding:20px;background:#fff;border:1px solid #d5dbe2;border-radius:8px;margin:12px 0}li p{margin:8px 0 0}footer{font-size:13px;color:#4d5865}@media(max-width:420px){main{padding:20px 14px}h1{font-size:24px}}
input,select{display:block;width:100%;padding:10px 12px;margin:6px 0 16px;border:1px solid #aeb8c4;border-radius:6px;background:white;color:#20252b;font:inherit}details{margin-top:14px}summary{cursor:pointer;color:#245eaa}details p{overflow-wrap:anywhere;font-size:13px}input:focus,select:focus,summary:focus-visible{outline:2px solid #245eaa;outline-offset:2px}
button{background:#245eaa;color:white;border:0;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid #245eaa;outline-offset:3px}
</style></head><body><main>
<header><small>CODEX SKILL MANAGER / READ ONLY</small><h1>能力管理器</h1><p>查看本地技能文件与来源证据。</p></header>
<p class="notice">只读清单：文件存在不等于技能已启用，插件缓存不等于已安装。使用次数尚未统计。</p>
<details><summary>重复与同名冲突候选</summary><div id="comparisons"></div></details>
<label for="search">搜索名称、描述或路径</label><input id="search" type="search" placeholder="输入关键词">
<label for="source">来源</label><select id="source"><option value="">全部来源</option></select>
<button id="refresh" type="button">重新扫描</button>
<button id="check-plugins" type="button">核对插件安装状态</button>
<p>安装核对调用 Codex CLI，可能连接已配置的插件市场；不发送技能正文。普通扫描仅检查本地文件。</p>
<p id="status" role="status">正在连接 MCP 宿主…</p><ul id="skills" aria-label="技能文件清单"></ul>
<details><summary>扫描范围、限制与问题</summary><div id="evidence"></div></details>
<footer>当前按文件实例计数。同名与相同内容副本均保留；未读取使用日志。</footer>
</main><script>/* APP_BUNDLE */</script></body></html>
