<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>能力管理器</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20252b;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 24px}header{border-bottom:1px solid #d5dbe2;padding-bottom:22px}h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:0}p{line-height:1.7}small{color:#245eaa;font-weight:600;letter-spacing:.08em}.notice{padding:14px 18px;background:#fff4dd;color:#71420d;border-left:3px solid #925b12}#status{color:#4d5865;font-size:14px}ul{list-style:none;padding:0}li{padding:20px;background:#fff;border:1px solid #d5dbe2;border-radius:8px;margin:12px 0}li p{margin:8px 0 0}footer{font-size:13px;color:#4d5865}@media(max-width:420px){main{padding:20px 14px}h1{font-size:24px}}
input,select{display:block;width:100%;padding:10px 12px;margin:6px 0 16px;border:1px solid #aeb8c4;border-radius:6px;background:white;color:#20252b;font:inherit}details{margin-top:14px}summary{cursor:pointer;color:#245eaa}details p{overflow-wrap:anywhere;font-size:13px}input:focus,select:focus,summary:focus-visible{outline:2px solid #245eaa;outline-offset:2px}
button{background:#245eaa;color:white;border:0;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:2px solid #245eaa;outline-offset:3px}
#management-plan p,#archives p{overflow-wrap:anywhere}
textarea{display:block;width:100%;min-height:90px;margin:8px 0;padding:10px;font:inherit;border:1px solid #aeb8c4;border-radius:6px}input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 12px 0}textarea:focus{outline:2px solid #245eaa;outline-offset:2px}
body{background:#fff}main{max-width:1040px}header{padding-bottom:16px;margin-bottom:28px}header small{display:none}
#activity-panel{margin:0 0 32px}.activity-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.activity-heading h2{margin-right:auto;font-size:20px}.activity-tabs{display:flex;gap:4px;background:#f3f5f7;border-radius:8px;padding:4px}.activity-tabs button{background:transparent;color:#536171;padding:7px 15px}.activity-tabs button[aria-pressed=true]{background:#fff;color:#155cb5;box-shadow:0 1px 3px #20252b20}.activity-heading select{width:auto;margin:0;padding:7px 9px;font-size:13px}.activity-caption,.activity-note{font-size:12px;color:#657182;line-height:1.7}.calendar-scroll{overflow-x:auto;padding:8px 0}.activity-calendar{min-width:710px}.calendar-months{display:grid;grid-template-columns:repeat(var(--weeks),1fr);height:24px;font-size:11px;color:#657182}.calendar-months span{overflow:visible;white-space:nowrap}.calendar-cells{display:grid;grid-template-rows:repeat(7,12px);grid-template-columns:repeat(var(--weeks),1fr);grid-auto-flow:column;gap:3px}.heat-cell,.heat-empty,.heat-swatch{border-radius:3px;min-width:0;padding:0;border:0}.heat-cell{width:100%;height:12px;cursor:pointer}.heat-cell:hover{outline:2px solid #183b6b;outline-offset:1px}.level-0{background:#f0f2f4}.level-1{background:#cce6ff}.level-2{background:#85bfff}.level-3{background:#328be8}.level-4{background:#075ebd}.heat-unknown{background:repeating-linear-gradient(135deg,#f6f7f9,#f6f7f9 3px,#e3e7ec 3px,#e3e7ec 4px)}.activity-tooltip{font-size:12px;min-height:21px;color:#31506f;margin:8px 0}.activity-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;color:#657182;font-size:11px}.heat-swatch{display:inline-block;width:12px;height:12px}.activity-legend span:last-child{margin-left:14px}.activity-rankings{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:26px}.activity-rankings h3{font-size:14px;font-weight:600;margin:0 0 12px}.activity-ranking{list-style:none;padding:0;margin:0}.activity-ranking li{display:flex;align-items:center;gap:10px;padding:10px 0;margin:0;border:0;border-radius:0;border-bottom:1px solid #eef0f3;min-width:0}.activity-avatar{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid #e0e6ee;border-radius:9px;color:#245eaa;background:#f8fbff;font-size:12px;font-weight:600}.activity-ranking li>div{min-width:0;flex:1}.activity-ranking strong{display:block;font-size:13px;overflow-wrap:anywhere}.ranking-detail{font-size:11px;color:#75808e;overflow-wrap:anywhere}.ranking-count{font-size:12px;white-space:nowrap;color:#245eaa}@media(max-width:600px){.activity-rankings{grid-template-columns:1fr;gap:22px}.activity-heading h2{width:100%}.activity-caption{max-width:100%}}
.entity-panel{margin-top:26px;padding-top:20px;border-top:1px solid #eef0f3}.entity-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.entity-heading h3{margin:0;font-size:15px}.entity-dates{display:flex;gap:10px;flex-wrap:wrap}.entity-dates label{display:flex;align-items:center;gap:6px;font-size:12px;color:#657182}.entity-dates input{width:auto;margin:0;padding:6px 8px;font-size:12px}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,20px);gap:5px;margin-top:14px}.entity-cell{height:20px;width:20px}.entity-cell:focus-visible{outline:2px solid #183b6b;outline-offset:2px}
</style></head><body><main>
<header><small>CODEX SKILL MANAGER / LOCAL</small><h1>能力管理器</h1><span id="app-version" style="display:block;font-size:12px;line-height:1.5;color:#657182">版本 / Version <!-- APP_VERSION --></span><p>查看本地技能文件与来源证据。</p></header>
<section id="activity-panel" aria-label="使用活动热力图与排名"></section>
<p id="status" role="status">正在读取统计…</p>
</main><script>/* APP_BUNDLE */</script></body></html>
